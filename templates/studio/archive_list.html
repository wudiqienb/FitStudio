{% extends 'studio/base.html' %}
{% block title %}已归档会员{% endblock %}
{% block content %}<h1>已归档会员</h1><a href="{% url 'studio:members' %}">返回会员列表</a>
{% for member in members %}<article class="card card-body mt-3"><h2>{{ member.name }}</h2><p>{{ member.phone|default:'未填写联系电话' }}</p>
<a href="{% url 'studio:archived_member_detail' member.pk %}">查看历史 / 恢复</a></article>{% empty %}<p>暂无已归档会员</p>{% endfor %}{% endblock %}
