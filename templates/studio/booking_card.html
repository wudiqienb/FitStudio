<article class="card mb-3"><div class="card-body">
  <div class="section-heading"><h3 class="mb-0">{{ booking.starts_at|date:"H:i" }}—{{ booking.ends_at|date:"H:i" }}</h3><span class="status-pill booking-{{ booking.status }}">{{ booking.get_status_display }}</span></div>
  <h2 class="mt-3">{{ booking.member }} · {{ booking.course_name }}</h2><p class="text-secondary">{{ booking.starts_at|date:"n月j日" }} · 教练 {{ booking.coach }} · {{ booking.credits_cost }}课时</p>
  <a class="btn btn-outline-primary" href="{% url 'studio:booking_detail' booking.pk %}">查看预约</a>
</div></article>
